name: Supabase Migrate

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Requires repo secrets: SUPABASE_ACCESS_TOKEN (PAT), SUPABASE_PROJECT_REF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migrations in order
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SB_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          for f in \
            supabase/migrations/20260825000001_climate_action_os_schema.sql \
            supabase/migrations/20260825120000_fix_rls_org_scope.sql \
            supabase/migrations/20260825130000_hardening.sql; do
            echo "Applying $f ..."
            jq -Rs '{query: .}' "$f" > /tmp/payload.json
            curl -sf -X POST \
              "https://api.supabase.com/v1/projects/${SB_REF}/database/query" \
              -H "Authorization: Bearer ${SB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @/tmp/payload.json > /tmp/result.json || { echo "FAILED: $f"; cat /tmp/result.json; exit 1; }
            echo "OK: $f"
          done
          echo "All migrations applied."
